<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="960" viewBox="0 0 1600 960" role="img" aria-labelledby="title desc"><title id="title">KOKORO-WHISPER-FARGATE</title><desc id="desc">Open-weight speech, shipped. Kokoro-82M text-to-speech and Whisper ASR as a production-style AWS service.</desc><defs><linearGradient id="paper" x2="1" y2="1"><stop stop-color="#F7F9FC"/><stop offset="1" stop-color="#EFF3F7"/></linearGradient></defs><rect width="1600" height="960" fill="url(#paper)"/><g font-family="Inter, 'Segoe UI', Arial, sans-serif">
<rect x="0" y="0" width="1600" height="9" rx="0" fill="#007F78" stroke="none"/>
<text x="64" y="66" font-size="20" fill="#172837" font-weight="700" letter-spacing="2" data-maxx="900">KOKORO-WHISPER-FARGATE</text>
<text x="1536" y="66" font-size="16" fill="#007F78" font-weight="600" letter-spacing="1" text-anchor="end">SPEECH SERVICE / AWS</text>
<text x="60" y="167" font-size="72" fill="#142638" font-weight="500" data-maxx="1540">Open-weight speech, shipped.</text>
<text x="64" y="221" font-size="27" fill="#344C5F" font-weight="400" data-maxx="1536">Kokoro-82M text-to-speech and Whisper ASR as a production-style AWS service.</text>
<text x="64" y="262" font-size="20" fill="#697988" font-weight="400" data-maxx="1536">ECS Fargate on Graviton, 100% AWS CDK and keyless OIDC CI/CD.</text>
<rect x="64" y="323" width="344" height="272" rx="20" fill="#FFFFFF" stroke="#DCE4EB"/>
<rect x="88" y="349" width="44" height="5" rx="2" fill="#007F78" stroke="none"/>
<text x="88" y="393" font-size="17" fill="#007F78" font-weight="700" letter-spacing="1.4" data-maxx="394">01 / PUSH</text>
<text x="88" y="441" font-size="28" fill="#172C3C" font-weight="600" data-maxx="394">git push → main</text>
<text x="88" y="485" font-size="18" fill="#5C6D7B" font-weight="400" data-maxx="394">pytest on every push</text>
<text x="88" y="517" font-size="18" fill="#5C6D7B" font-weight="400" data-maxx="394">OIDC role federation</text>
<text x="88" y="549" font-size="18" fill="#5C6D7B" font-weight="400" data-maxx="394">No stored AWS keys</text>
<path d="M416 458h16m-6-6 6 6-6 6" fill="none" stroke="#007F78" stroke-width="2"/>
<rect x="440" y="323" width="344" height="272" rx="20" fill="#FFFFFF" stroke="#DCE4EB"/>
<rect x="464" y="349" width="44" height="5" rx="2" fill="#007F78" stroke="none"/>
<text x="464" y="393" font-size="17" fill="#007F78" font-weight="700" letter-spacing="1.4" data-maxx="770">02 / BUILD</text>
<text x="464" y="441" font-size="28" fill="#172C3C" font-weight="600" data-maxx="770">ARM64 image</text>
<text x="464" y="485" font-size="18" fill="#5C6D7B" font-weight="400" data-maxx="770">Model weights baked in</text>
<text x="464" y="517" font-size="18" fill="#5C6D7B" font-weight="400" data-maxx="770">Pushed to ECR</text>
<text x="464" y="549" font-size="18" fill="#5C6D7B" font-weight="400" data-maxx="770">cdk deploy InfraStack</text>
<path d="M792 458h16m-6-6 6 6-6 6" fill="none" stroke="#007F78" stroke-width="2"/>
<rect x="816" y="323" width="344" height="272" rx="20" fill="#FFFFFF" stroke="#DCE4EB"/>
<rect x="840" y="349" width="44" height="5" rx="2" fill="#007F78" stroke="none"/>
<text x="840" y="393" font-size="17" fill="#007F78" font-weight="700" letter-spacing="1.4" data-maxx="1146">03 / SERVE</text>
<text x="840" y="441" font-size="28" fill="#172C3C" font-weight="600" data-maxx="1146">Fargate on Graviton</text>
<text x="840" y="485" font-size="18" fill="#5C6D7B" font-weight="400" data-maxx="1146">FastAPI, 2 vCPU / 6 GB</text>
<text x="840" y="517" font-size="18" fill="#5C6D7B" font-weight="400" data-maxx="1146">/synthesize · /transcribe</text>
<text x="840" y="549" font-size="18" fill="#5C6D7B" font-weight="400" data-maxx="1146">Behind a load balancer</text>
<path d="M1168 458h16m-6-6 6 6-6 6" fill="none" stroke="#007F78" stroke-width="2"/>
<rect x="1192" y="323" width="344" height="272" rx="20" fill="#FFFFFF" stroke="#DCE4EB"/>
<rect x="1216" y="349" width="44" height="5" rx="2" fill="#007F78" stroke="none"/>
<text x="1216" y="393" font-size="17" fill="#007F78" font-weight="700" letter-spacing="1.4" data-maxx="1522">04 / WATCH</text>
<text x="1216" y="441" font-size="28" fill="#172C3C" font-weight="600" data-maxx="1522">Alarms as code</text>
<text x="1216" y="485" font-size="18" fill="#5C6D7B" font-weight="400" data-maxx="1522">ALB 5xx, CPU above 85%</text>
<text x="1216" y="517" font-size="18" fill="#5C6D7B" font-weight="400" data-maxx="1522">SNS email alerts</text>
<text x="1216" y="549" font-size="18" fill="#5C6D7B" font-weight="400" data-maxx="1522">All defined in CDK</text>
<rect x="64" y="635" width="470" height="211" rx="18" fill="#DDF3EA" stroke="none"/>
<text x="88" y="675" font-size="15" fill="#007F78" font-weight="700" letter-spacing="1.2" data-maxx="516">COST</text>
<text x="88" y="722" font-size="24" fill="#193346" font-weight="600" data-maxx="516">~$74/mo, $0 when off</text>
<text x="88" y="765" font-size="18" fill="#536777" font-weight="400" data-maxx="516">cdk destroy turns the stack off;</text>
<text x="88" y="795" font-size="18" fill="#536777" font-weight="400" data-maxx="516">training runs cost $2–7 each on Spot.</text>
<rect x="565" y="635" width="470" height="211" rx="18" fill="#E8EDF3" stroke="none"/>
<text x="589" y="675" font-size="15" fill="#007F78" font-weight="700" letter-spacing="1.2" data-maxx="1017">WAR STORY</text>
<text x="589" y="722" font-size="24" fill="#193346" font-weight="600" data-maxx="1017">A Graviton vocoder bug, fixed</text>
<text x="589" y="765" font-size="18" fill="#536777" font-weight="400" data-maxx="1017">oneDNN corrupted the audio (−6 dB).</text>
<text x="589" y="795" font-size="18" fill="#536777" font-weight="400" data-maxx="1017">One line restores golden-matching speech.</text>
<rect x="1066" y="635" width="470" height="211" rx="18" fill="#E8EDF3" stroke="none"/>
<text x="1090" y="675" font-size="15" fill="#007F78" font-weight="700" letter-spacing="1.2" data-maxx="1518">ML TRACK</text>
<text x="1090" y="722" font-size="24" fill="#193346" font-weight="600" data-maxx="1518">Bilingual Whisper + LoRA</text>
<text x="1090" y="765" font-size="18" fill="#536777" font-weight="400" data-maxx="1518">Merged to CTranslate2 int8 for CPU serving.</text>
<text x="1090" y="795" font-size="18" fill="#536777" font-weight="400" data-maxx="1518">Built; not yet run at scale.</text>
<path d="M64 888h1472" stroke="#CED9E3"/>
<text x="64" y="923" font-size="17" fill="#647788" font-weight="400" data-maxx="1536">PYTHON 3.12  /  FastAPI · AWS CDK · GitHub Actions · CloudWatch.</text>
</g></svg>
