name: ci-cd

on:
  pull_request:
  push:
    branches: [main]
    # Defense-in-depth vs the "training commit redeployed prod" incident:
    # commits touching ONLY these paths don't trigger CI at all.
    paths-ignore:
      - '**.md'
      - 'training/**'
      - 'avatar_worker/**'
      - 'LICENSE'
  workflow_dispatch:   # manual "deploy now" button in the Actions tab

permissions:
  id-token: write     # required for OIDC
  contents: read

env:
  AWS_REGION: us-east-1
  ROLE_ARN: arn:aws:iam::531594843903:role/github-deploy-kokoro

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: pytest -v

  deploy:
    needs: test
    # Skip with "[skip deploy]" in the commit message — lets docs/cleanup
    # commits land while the stack is destroyed without powering it back on.
    # Manual deploys: Actions tab -> ci-cd -> Run workflow.
    if: >-
      github.ref == 'refs/heads/main' &&
      !contains(github.event.head_commit.message || '', '[skip deploy]')
    # ARM runner: builds the ARM64 image natively (free for public repos).
    # Private repo? Switch to ubuntu-latest + docker/setup-qemu-action.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm install -g aws-cdk
      - run: pip install -r infra/requirements.txt
      - run: cd infra && cdk deploy InfraStack --require-approval never
